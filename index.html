<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neurodiversity Aotearoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F6F7F5; --surface: #FFFFFF; --ink: #1E2422; --ink-soft: #565F5B;
    --navy: #1F3864; --accent-strong: #2E5E44; --accent-soft: #E4EFE6; --border: #DDE3DB;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161A; --surface: #1A2024; --ink: #ECEFEC; --ink-soft: #A9B2AC;
      --navy: #8FAAD6; --accent-strong: #98CDAE; --accent-soft: #1D2B24; --border: #2A3236;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink);
    font-family: "Public Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px; text-align: center;
  }
  .card { max-width: 480px; }
  .eyebrow {
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--accent-strong); display: block; margin-bottom: 10px;
  }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(26px, 5vw, 34px); margin: 0 0 14px; }
  p { color: var(--ink-soft); font-size: 15.5px; line-height: 1.55; margin: 0 0 26px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: "Public Sans", sans-serif; font-size: 14.5px; font-weight: 600;
    text-decoration: none; padding: 11px 22px; border-radius: 10px;
    background: var(--accent-strong); color: #FFFFFF;
  }
  .btn:hover { opacity: 0.9; }
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Wairarapa · Aotearoa New Zealand</span>
    <h1>Neurodiversity Aotearoa</h1>
    <p>This site is under construction. In the meantime, the classroom tools are live and ready to use.</p>
    <a class="btn" href="/tools/">Browse the tools ↗</a>
  </div>
</body>
</html>
